<a class="font-label-sm text-label-sm text-secondary hover:underline underline-offset-4 transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-secondary focus:ring-0 px-0 py-sm font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>

<div class="pt-sm">
